<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AES_GA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.1.9/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/git-repository-private-fill.svg') }}">
</head>

<body>
  <div class="container">
    <div class= "title-aes+GA">
      <h1>AES+GA</h1>
    </div>

    <div class="card">
      <h2>Enkripsi Dan Dekripsi File</h2>

      <!-- Input file -->
      <div class="row">
        <label for="fileIn" class="file-label">Pilih File (PDF/DOCX)</label>
        <input id="fileIn" type="file" accept=".pdf,.docx" />
      </div>

      <!-- ADVANCED GA SETTINGS -->
      <div style="margin-top: 15px; padding: 15px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 5px;">
        <details>
          <summary style="cursor: pointer; font-weight: bold; color: #333;">⚙️ Advanced GA Settings (Optional)</summary>
          <div style="margin-top: 15px;" class="row">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
              <div>
                <label for="population" style="font-size: 13px;">Population</label>
                <input type="number" id="population" value="60" min="4" max="200" style="width: 100%; padding: 5px;">
              </div>
              <div>
                <label for="generations" style="font-size: 13px;">Generations</label>
                <input type="number" id="generations" value="80" min="1" max="500" style="width: 100%; padding: 5px;">
              </div>
              <div>
                <label for="fitness_threshold" style="font-size: 13px;">Threshold</label>
                <input type="number" id="fitness_threshold" value="0.95" min="0.1" max="1.0" step="0.001" style="width: 100%; padding: 5px;">
              </div>
              <div>
                <label for="crossover_rate" style="font-size: 13px;">Crossover Rate</label>
                <input type="number" id="crossover_rate" value="0.8" step="0.1" min="0" max="1" style="width: 100%; padding: 5px;">
              </div>
              <div>
                <label for="mutation_rate" style="font-size: 13px;">Mutation Rate</label>
                <input type="number" id="mutation_rate" value="0.05" step="0.01" min="0" max="1" style="width: 100%; padding: 5px;">
              </div>
            </div>
          </div>
          <p style="margin-top: 10px; font-size: 12px; color: #666;">
            💡 <b>Tips Test GAGAL:</b> Population=4, Generations=3, Mutation Rate=0.0, Threshold=0.99
          </p>
        </details>
      </div>

      <div class="file-info">
        <div><b>File:</b> <span id="fname">-</span></div>
        <div><b>Ukuran:</b> <span id="fsize">-</span></div>
        <div><b>Mode:</b> <span id="fmode">AES-128-GA</span></div>
      </div>

      <p id="note" class="note"></p>

      <hr>

      <!-- Tombol GA & Encrypt -->
      <div class="row">
        <button id="btnGenKey" class="btn" disabled>Generate Key (GA)</button>
        <button id="btnEncFile" class="btn" disabled>Encrypt (AES+GA)</button>
      </div>

      <!-- Info GA -->
      <div id="gaResult" style="display:none; margin-top: 10px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div>
            <label for="ga_key">Key GA (Base64)</label>
            <textarea id="ga_key" rows="2" readonly></textarea>
          </div>
          <div>
            <label for="ga_key_hex">Key GA (Hexadecimal - 16 Byte)</label>
            <textarea id="ga_key_hex" rows="2" readonly></textarea>
          </div>
        </div>
        <div style="margin-top: 10px;">
          <label for="ga_info">Informasi GA</label>
          <textarea id="ga_info" rows="2" readonly style="width: 100%;"></textarea>
        </div>
      </div>

      <hr>

      <h3>Output Package</h3>
      <div class="grid">
        <div>
          <label for="cipher_b64">Cipher Text</label>
          <textarea id="cipher_b64" rows="8" readonly></textarea>
        </div>
        <div>
          <div style="margin-bottom: 10px;">
            <label for="key">Key AES (Base64)</label>
            <textarea id="key" rows="2" readonly></textarea>
          </div>
          <div>
            <label for="key_hex">Key AES (Hex)</label>
            <textarea id="key_hex" rows="2" readonly></textarea>
          </div>
        </div>
      </div>

      <div class="grid" style="margin-top: 10px;">
        <div>
          <label for="encms">Waktu Enkripsi (ms)</label>
          <textarea id="encms" rows="1" readonly></textarea>
        </div>
        <div>
          <label for="decms">Waktu Dekripsi (ms)</label>
          <textarea id="decms" rows="1" readonly></textarea>
        </div>
      </div>

      <hr>

      <!-- ✅ FIXED SECTION -->
      <h2>Pengujian Ciphertext</h2>

      <div class="grid">
        <!-- KIRI -->
        <div>
          <button id="btnEntropy" class="menu-button">Entropy Test</button>
          <div id="resultEntropy" class="test-result"></div>

          <button id="btnNist" class="menu-button">Run NIST Test</button>
          <div id="resultNist" class="test-result"></div>
          <div id="resultNistRuns" class="test-result"></div>
        </div>

        <!-- KANAN -->
        <div>
          <button id="btnDec" class="menu-button">Dekripsi & Download</button>
          <button id="btnSaveHistory" class="menu-button">Save History (XLSX)</button>
        </div>
      </div>

      <hr>

      <!-- Tombol Kembali -->
      <div class="row">
        <button id="btnBackToHome">Kembali ke Halaman Utama</button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.1.9/dist/sweetalert2.all.min.js"></script>
  <script src="{{ url_for('static', filename='js/app_ga.js') }}?v=6"></script>
</body>
</html>
