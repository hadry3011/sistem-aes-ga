<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AES_GA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.1.9/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/git-repository-private-fill.svg') }}">
</head>

<body>
  <div class="container">
    <div class="title-aes">
      <h1>AES + Genetic Algorithm</h1>
    </div>

    <div class="card">
      <h2>Enkripsi Dan Dekripsi File</h2>

      <!-- Input file -->
      <div class="row">
        <label for="fileIn" class="file-label">Pilih File (PDF/DOCX)</label>
        <input id="fileIn" type="file" accept=".pdf,.docx" />
      </div>

      <div class="file-info">
        <div><b>File:</b> <span id="fname">-</span></div>
        <div><b>Ukuran:</b> <span id="fsize">-</span></div>
        <div><b>Mode:</b> <span id="fmode">AES-128-GA</span></div>
      </div>

      <p id="note" class="note"></p>

      <hr>

      <!-- Tombol GA & Encrypt -->
      <div class="row">
        <button id="btnGenKey" class="btn" disabled>Generate Key (GA)</button>
        <button id="btnEncFile" class="btn" disabled>Encrypt (AES+GA)</button>
      </div>

      <!-- Info GA -->
      <div id="gaResult" style="display:none; margin-top: 20px;">
        <div class="output-card">
          <div class="card-header">
            <span class="icon">🧬</span>
            <span class="title">Detail Optimasi GA</span>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label for="ga_key_b64_display">Key Hasil GA (Base64)</label>
              <textarea id="ga_key_b64_display" rows="2" readonly placeholder="Kunci hasil optimasi GA"></textarea>
            </div>
            <div>
              <label for="ga_key_hex_display">Key Hasil GA (Hex)</label>
              <textarea id="ga_key_hex_display" rows="2" readonly placeholder="Kunci hasil optimasi GA (Hex)"></textarea>
            </div>
          </div>
          <div style="margin-top: 10px;">
            <label for="ga_info">Statistik Evolusi GA</label>
            <textarea id="ga_info" rows="3" readonly style="width: 100%;"></textarea>
          </div>
        </div>
      </div>

      <hr>

      <!-- Output Package -->
      <h3>Output Package</h3>
      <div class="grid">
        <!-- Kolom 1: Ciphertext -->
        <div class="output-card">
          <div class="card-header">
            <span class="icon">🔒</span>
            <span class="title">Data Terenkripsi</span>
          </div>
          <label for="cipher_b64">Cipher Text</label>
          <textarea id="cipher_b64" rows="6" placeholder="Hasil cipher akan muncul di sini"></textarea>
        </div>

        <!-- Kolom 2: Plaintext -->
        <div class="output-card">
          <div class="card-header">
            <span class="icon">🔓</span>
            <span class="title">Hasil Dekripsi</span>
          </div>
          <label for="plaintext_out">Plaintext (Hasil Dekripsi)</label>
          <textarea id="plaintext_out" rows="6" placeholder="Hasil dekripsi (JSON) akan muncul di sini" readonly></textarea>
        </div>

        <!-- Kolom 3: Key Information -->
        <div class="output-card">
          <div class="card-header">
            <span class="icon">🔑</span>
            <span class="title">Detail Kunci AES</span>
          </div>
          <label for="key_b64">Key AES (Base64)</label>
          <textarea id="key_b64" rows="2" placeholder="Kunci AES Base64"></textarea>

          <label for="key_hex" style="margin-top: 12px; display: block;">Key AES (Hex)</label>
          <textarea id="key_hex" rows="2" placeholder="Kunci AES Hex"></textarea>

          <label for="key_info" style="margin-top: 12px; display: block;">Informasi Key</label>
          <input id="key_info" type="text" value="16 byte / 128 bit" readonly />
        </div>

        <!-- Kolom 4: Statistik Waktu -->
        <div class="output-card timing-card">
          <div class="card-header">
            <span class="icon">⏱️</span>
            <span class="title">Statistik Waktu</span>
          </div>
          <div class="timing-item">
            <label for="encrypt_time">Waktu Enkripsi</label>
            <div class="input-group">
              <input id="encrypt_time" type="text" readonly placeholder="0" />
              <span class="unit">ms</span>
            </div>
          </div>
          <div class="timing-item">
            <label for="decrypt_time">Waktu Dekripsi</label>
            <div class="input-group">
              <input id="decrypt_time" type="text" readonly placeholder="0" />
              <span class="unit">ms</span>
            </div>
          </div>
        </div>
      </div>

      <hr>

      <!-- ✅ FIXED SECTION -->
      <h2>Pengujian Ciphertext</h2>

      <div class="grid">
        <!-- KIRI -->
        <div>
          <button id="btnEntropy" class="menu-button">Entropy Test</button>
          <div id="resultEntropy" class="test-result"></div>

          <button id="btnNist" class="menu-button">Run NIST Test</button>
          <div id="resultNist" class="test-result"></div>
          <div id="resultNistRuns" class="test-result"></div>

          <button id="btnBerTest" class="menu-button" style="background-color: #1f6feb;">BER Test</button>
          <div id="resultBer" class="test-result"></div>
        </div>

        <!-- KANAN -->
        <div>
          <button id="btnDec" class="menu-button">Dekripsi & Download</button>
          <button id="btnSaveHistory" class="menu-button">Save History (XLSX)</button>
          <button id="btnResetHistory" class="menu-button" style="background-color: #1f6feb;">Reset History</button>
        </div>
      </div>

      <hr>

      <!-- Tombol Kembali -->
      <div class="row">
        <button id="btnBackToHome">Kembali ke Halaman Utama</button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.1.9/dist/sweetalert2.all.min.js"></script>
  <script src="{{ url_for('static', filename='js/app_ga.js') }}?v=8"></script>
</body>
</html>
