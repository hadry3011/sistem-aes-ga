<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AES Baseline</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.1.9/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/git-repository-private-fill.svg') }}">
</head>
<body>
  <div class="container">
    <div class= "title-aes">
      <h1>AES Baseline</h1>
    </div>

    <div class="card">
      <h2>Enkripsi Dan Dekripsi File</h2>

      <!-- Input file -->
      <div class="row">
        <label for="fileIn" class="file-label">Pilih File (PDF/DOCX)</label>
        <input id="fileIn" type="file" accept=".pdf,.docx" />
      </div>

      <!-- Info file -->
      <div class="file-info">
        <div><b>File:</b> <span id="fname">-</span></div>
        <div><b>Ukuran:</b> <span id="fsize">-</span></div>
        <div><b>Mode:</b> <span id="fmode">AES-128-BASELINE</span></div>
      </div>

      <p id="note" class="note"></p>

      <!-- Tombol Generate Key & Encrypt -->
      <div class="row">
        <button id="btnGenKey" class="btn menu-button" disabled>Generate Key</button>
        <button id="btnEncFile" class="btn menu-button" disabled>Encrypt</button>
      </div>

      <hr>

      <!-- Output Package -->
      <h3>Output Package</h3>
      <div class="grid">
        <div>
          <label for="cipher_b64">Cipher Text</label>
          <textarea id="cipher_b64" rows="6" placeholder="Hasil cipher akan muncul di sini"></textarea>
        </div>

        <div>
          <label for="key_b64">Key AES </label>
          <textarea id="key_b64" rows="2" placeholder="Hasil kunci AES akan muncul di sini"></textarea>

          <label for="key_hex" style="margin-top: 12px;">Key AES (Hex)</label>
          <textarea id="key_hex" rows="2" placeholder="Hasil kunci AES (Hex) akan muncul di sini"></textarea>

          <label for="key_info" style="margin-top: 12px;">Informasi Key</label>
          <input id="key_info" type="text" value="16 byte / 128 bit" readonly />
        </div>

        <div>
          <label for="encrypt_time">Waktu Enkripsi (ms)</label>
          <input id="encrypt_time" type="text" readonly />
        </div>

        <div>
          <label for="decrypt_time">Waktu Dekripsi (ms)</label>
          <input id="decrypt_time" type="text" readonly />
        </div>
      </div>

      <hr>

      <!-- Pengujian -->
      <h2>Pengujian Ciphertext</h2>
      <div class="grid">
        <div>
          <!-- Tombol untuk Entropy Test dan hasilnya langsung di bawah tombol -->
          <button id="btnEntropy" class="menu-button">Entropy Test</button>
          <div id="resultEntropy" class="test-result"></div> <!-- Hasil test langsung di bawah tombol -->

          <!-- Tombol untuk Run NIST Test dan hasilnya langsung di bawah tombol -->
          <button id="btnNist" class="menu-button">Run NIST Test</button>
          <div id="resultNist" class="test-result"></div> <!-- Hasil test langsung di bawah tombol -->
          <div id="resultNistBlockFreq" class="test-result"></div> <!-- Block Frequency Test -->
          <div id="resultNistRuns" class="test-result"></div> <!-- Hasil test langsung di bawah tombol -->
        </div>
        <div>
          <button id="btnDec" class="menu-button">Dekrip & Download</button>
          <button id="btnSaveHistory" class="menu-button">Save History (XLSX)</button>
        </div>
      </div>

      <!-- PROSES DEKRIPSI -->
      <div id="decryptProcess" style="display:none; margin-top: 20px; padding: 15px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 5px;">
        <h3 style="margin-top: 0;">📋 Proses Dekripsi</h3>
        
        <!-- Ciphertext Preview -->
        <div style="margin-bottom: 15px;">
          <label style="font-weight: bold;">Ciphertext (Base64 Preview):</label>
          <div id="cipherPreview" style="background: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 3px; font-family: monospace; font-size: 11px; word-break: break-all; max-height: 60px; overflow-y: auto;"></div>
        </div>

        <!-- Step-by-Step Status -->
        <div id="decryptSteps" style="margin-bottom: 15px;"></div>

        <!-- File Info -->
        <div id="fileInfo" style="display:none; background: #d4edda; padding: 15px; border: 1px solid #c3e6cb; border-radius: 3px; margin-bottom: 15px;">
          <h4 style="margin-top: 0; color: #155724;">✅ Informasi File</h4>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div><b>Tipe File:</b> <span id="fileType">-</span></div>
            <div><b>Ukuran:</b> <span id="fileSize">-</span></div>
            <div><b>Filename:</b> <span id="fileDecryptedName">-</span></div>
            <div><b>Waktu Dekripsi:</b> <span id="fileDecTime">-</span></div>
          </div>
        </div>

        <!-- Download Button -->
        <div id="downloadSection" style="display:none; text-align: center;">
          <button id="btnDownload" class="menu-button" style="background: #28a745; color: white; padding: 12px 30px; font-size: 16px;">⬇️ Download File Dekripsi</button>
        </div>
      </div>

      <!-- Hasil dari perhitungan Entropy dan NIST -->
        <div class="file-info">
       <!-- <div><b>Entropy (cipher):</b> <span id="entropyOut">-</span></div>
        <div><b>NIST Frequency:</b> <span id="nistFreqOut">-</span></div>
        <div><b>NIST Runs:</b> <span id="nistRunsOut">-</span></div>-->
      </div>

      <hr>

      <!-- Navigasi -->
      <div class="row">
        <button id="btnBackToHome" class="menu-button">Kembali ke Halaman Utama</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.1.9/dist/sweetalert2.all.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
